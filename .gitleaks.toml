# gitleaks config for Hash (used by the public-mirror publish gate and any local
# scan). Extends the default ruleset, then allowlists documentation/config-example
# PLACEHOLDERS: .env.example uses obvious change-me markers, never real secrets. A
# real leaked credential would not carry these markers, so it is still caught.
title = "hash"

[extend]
useDefault = true

[allowlist]
description = "Config placeholders are inert; generated frontend output is scanned at its source instead"
paths = [
  # `gitleaks --no-git` does not honor .gitignore. These are generated from
  # tracked frontend sources + the frozen Bun lockfile and contain minified
  # third-party strings that trigger generic-api-key false positives.
  '''^frontend/build/''',
  '''^frontend/\.svelte-kit/''',
  '''^frontend/node_modules/''',
  '''^e2e/node_modules/''',
]
regexes = [
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''example\.com''',
  '''molliepathsecret16''',
  '''mollie-test-key''',
  '''EXAMPLE''',
  # Historical log-redaction regression fixture. The exact low-entropy value
  # appeared only as untrusted text that the test required the scrubber to
  # remove; pin the complete fixture instead of allowlisting its file/rule.
  '''^live_EXAMPLE_NOT_A_REAL_KEY$''',
  # config_test.go audit-key fixture, in mirror history pre-split. It is
  # base64("fake-ed25519-seed-for-tests"), not a credential.
  '''ZmFrZS1lZDI1NTE5LXNlZWQtZm9yLXRlc3Rz''',
  # Public CI fixtures. Both values are committed in the development Compose
  # topology already and are deliberately public/non-production; pin their
  # complete values so the generic rule cannot hide a different key nearby.
  '''^qUUkXGsPxO6Vaay3hRuFTBdvO4dikHtLiin3Oy2hnV0=$''',
  '''^fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210$''',
]

# Exact reviewed inert fixtures: path AND extracted value, never a file/line waiver.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed inert fixture 1: exact value at exact source paths"
condition = "AND"
paths = ['''^internal/flarereport/operational_backlog_v1_test\.go$''']
regexTarget = "secret"
regexes = ['''^\x50\x52\x49\x56\x41\x54\x45\x5f\x49\x4e\x47\x45\x53\x54\x5f\x4b\x45\x59\x5f\x34\x32\x36$''']

