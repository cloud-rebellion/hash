description = "Reviewed inert fixture 2: exact value at exact source paths"
condition = "AND"
paths = ['''^internal/auth/oidc_observation409_test\.go$''']
regexTarget = "secret"
regexes = ['''^\x50\x52\x49\x56\x41\x54\x45\x5f\x53\x45\x43\x52\x45\x54\x5f\x34\x30\x39$''']

